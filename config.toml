# Game settings. Wedge values and envelopes live in wheel.toml.

[game]
main_rounds = 4
bonus_round = true
max_turns_per_round = 200

[rules]
vowel_cost = 250
express_vowel_cost = 250
solve_minimum = 1000
bonus_letters = ["R", "S", "T", "L", "N", "E"]
bonus_consonants = 3  # plus one vowel; a held Wild Card adds one more consonant

[bot]
version = 1  # picks the bot's code, data, and knobs; tournaments never mix versions

[llm]
# Unset, so each model plays at its own default. Claude Haiku 5.5 and GPT-6 Luna ignore
# temperature anyway. To set one, uncomment this; it must be 0.2 to 0.4 and is logged.
# temperature = 0.3
# Unset, so each model reasons at its own default effort; Claude models get their adaptive
# thinking switched on, since OpenRouter leaves it off unless asked. Set one level for every
# model with "none", "low", "medium", "high", "xhigh", or "max".
# reasoning_effort = "medium"

[decision]
# Decision seats: a decision model makes every choice, and the solver writes the answers.
decision_model = "openai/gpt-6-luna-decisions"  # its probabilities fit the threshold; Jev's run low
solver_model = "openai/gpt-6-luna"    # writes the decision seat's solves
solve_threshold = 0.8                 # solve once P(solvable) reaches this

[decision.thresholds]
# Per decision model thresholds from `uv run python -m rstlne.calibrate`.
# Calibrated 2026-10-27 on 50 dev.json puzzles (295 boards), solver openai/gpt-6-luna:
# logs/calibration/calibration-20261027-223934.json
"openai/gpt-6-luna-decisions" = 0.23
"typesafe/jev-1.14" = 0.28

[tournament]
# "all": a set is 6 games, every ordering of the 3 entrants across the seats.
# "cyclic": a set is 3 games, the seat rotations only.
set_permutations = "all"

[cli]
model_pause = 1.5         # seconds after each model move, so the game reads like a show
bonus_solve_seconds = 10  # a human's clock for the bonus solve
solve_pause = 10          # seconds to hold a solved board before the next round; --pause 0 skips it

[providers]
# Pin a model to one OpenRouter provider, by the tag on its endpoints page, so every game runs on
# the same build. No fallback: if that provider is down, calls fail after the usual retries.
# DeepSeek's own servers are blocked by this account's privacy setting (they may train on paid prompts).
# DeepInfra serves the model at FP8 and caches; the default cheapest host served FP4 and stalled.
"deepseek/deepseek-v4.1-flash-1017" = "deepinfra/fp8"

[models]
# OpenRouter slugs, picked from GET https://openrouter.ai/api/v1/models
slugs = [
    "anthropic/claude-haiku-5.5",
    "openai/gpt-6-luna",
    "deepseek/deepseek-v4.1-flash-1017",
    # backups
    "qwen/qwen3.8-flash",
    "z-ai/glm-5.3-flash",
]
