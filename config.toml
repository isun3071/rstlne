# Game settings. Wedge values and envelopes live in wheel.toml.

[game]
main_rounds = 4
bonus_round = true
max_turns_per_round = 200

[rules]
vowel_cost = 250
express_vowel_cost = 250
solve_minimum = 1000
bonus_letters = ["R", "S", "T", "L", "N", "E"]
bonus_consonants = 3  # plus one vowel; a held Wild Card adds one more consonant

[bot]
version = 1  # picks the bot's code, data, and knobs; tournaments never mix versions
# 1: win chances from the formula. 2: from the win table built in self-play. They tied in bot games.

[puzzlegen]
# Fresh puzzles: a generator writes them, code checks them, and a judge from another lab confirms the
# category. Both are cheap, from labs apart from every player model. Requests stand alone, so input stays small.
generator = "minimax/minimax-m3"  # in a 2026-10-29 trial it wrote the most familiar hard bonus answers
judge = "google/gemma-3-27b-it"
batch = 10            # answers per generator request
max_requests = 200    # generator requests per run, a cost guard
judges = 4            # judge calls in flight at once
rows = [12, 14, 14, 12]   # a main puzzle wraps into these board rows, never splitting a word
bonus_rows = [14, 14]     # a bonus puzzle fits these rows: shorter than main puzzles, and harder
main_min_letters = 8      # a main puzzle needs at least this many letters, so none is trivial
bonus_min_letters = 10    # a bonus puzzle needs at least this many: a phrase like JUMBO SHRIMP, not one short word
bonus_picks = "CDMA"      # a bonus puzzle is tested against R S T L N E plus these, the most common picks
bonus_min_hidden = 0.5    # and must keep at least this share of its letter squares hidden after them
# Category mix, by weight: dev.json's proportions, for the categories with a plain description
main_mix = { "Phrase" = 23, "Food & Drink" = 8, "Place" = 8, "Thing" = 7, "What Are You Doing?" = 7, "Event" = 6, "Before & After" = 6, "Same Name" = 4, "Rhyme Time" = 4, "Living Thing" = 3, "Person" = 3, "Fun & Games" = 3, "Around the House" = 3, "What Are You Wearing?" = 3, "Same Letter" = 3, "Occupation" = 2, "Living Things" = 2, "In the Kitchen" = 2, "On the Map" = 2, "Landmark" = 2, "Character" = 2, "Show Biz" = 2, "Things" = 1, "Title" = 1 }
bonus_mix = { "Thing" = 7, "Phrase" = 7, "Place" = 4, "Food & Drink" = 4, "Living Thing" = 3, "What Are You Doing?" = 2, "What Are You Wearing?" = 1, "Around the House" = 1, "Rhyme Time" = 1 }

[llm]
# Unset, so each model plays at its own default. Claude Haiku 5.5 and GPT-6 Luna ignore
# temperature anyway. To set one, uncomment this; it must be 0.2 to 0.4 and is logged.
# temperature = 0.3
# Unset, so each model reasons at its own default effort; Claude models get their adaptive
# thinking switched on, since OpenRouter leaves it off unless asked. Set one level for every
# model with "none", "low", "medium", "high", "xhigh", or "max".
# reasoning_effort = "medium"

[decision]
# Decision seats: a decision model makes every choice, and the solver writes the answers.
decision_model = "openai/gpt-6-luna-decisions"  # its probabilities fit the threshold; Jev's run low
solver_model = "openai/gpt-6-luna"    # writes the decision seat's solves
solve_threshold = 0.8                 # solve once P(solvable) reaches this

[decision.thresholds]
# Per decision model thresholds from `uv run python -m rstlne.calibrate`.
# Calibrated 2026-10-28 on 50 fresh puzzles from tuning-101 (291 boards), solver openai/gpt-6-luna:
# logs/calibration/calibration-20261028-231259.json. On dev.json they were 0.23 and 0.28.
"openai/gpt-6-luna-decisions" = 0.12
"typesafe/jev-1.14" = 0.31

[hybrid]
# Hybrid seats: the bot plays and the model reads the board. Each model needs both curves, measured on
# real game boards by `uv run python -m rstlne.calibrate trust`; a model without them can't sit in one.

[hybrid.trust]
# "<slug>" = [a, b, c, d, g]: trust in the model's fitting answer, on share showing, agreement with the
# reader, the reader's probability for that answer, and the reader's confidence in its own best answer.

[hybrid.steal]
# "<slug>" = [a, b, c, d]: an opponent's chance to solve, on share showing, the reader's confidence, and
# whether the model could read the board.

[tournament]
# "all": a set is 6 games, every ordering of the 3 entrants across the seats.
# "cyclic": a set is 3 games, the seat rotations only.
set_permutations = "all"

[cli]
model_pause = 1.5         # seconds after each model move, so the game reads like a show
bonus_solve_seconds = 10  # a human's clock for the bonus solve
solve_pause = 10          # seconds to hold a solved board before the next round; --pause 0 skips it

[providers]
# Pin a model to one OpenRouter provider, by the tag on its endpoints page, so every game runs on
# the same build. No fallback: if that provider is down, calls fail after the usual retries.
# DeepSeek's own servers are blocked by this account's privacy setting (they may train on paid prompts).
# DeepInfra serves the model at FP8 and caches; the default cheapest host served FP4 and stalled.
"deepseek/deepseek-v4.1-flash-1017" = "deepinfra/fp8"
"mistralai/mistral-small-3.2-24b-instruct" = "deepinfra/fp8"  # the puzzle generator until 2026-10-29
"minimax/minimax-m3" = "together"  # the puzzle generator: one of three hosts that take a JSON schema; not FP4, up 100%
"google/gemma-3-27b-it" = "deepinfra/fp8"  # the puzzle judge; some of its other hosts stall

[models]
# OpenRouter slugs, picked from GET https://openrouter.ai/api/v1/models
slugs = [
    "anthropic/claude-haiku-5.5",
    "openai/gpt-6-luna",
    "deepseek/deepseek-v4.1-flash-1017",
    # backups
    "qwen/qwen3.8-flash",
    "z-ai/glm-5.3-flash",
]
