[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rstlne"
version = "0.1.0"
description = "Wheel of Fortune where LLMs and a human play at the same table"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "httpx2>=2.16",  # the Decisions API client calls it directly
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]  # uv installs this group by default

[tool.setuptools.packages.find]
include = ["rstlne*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
